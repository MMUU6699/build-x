services:
  frontend:
    image: ${IMAGE_REGISTRY:-your-dockerhub-username}/build-x-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - build-x-network
    environment:
      - BACKEND_URL=http://backend:8000

  backend:
    image: ${IMAGE_REGISTRY:-your-dockerhub-username}/build-x-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    depends_on:
      - sandbox
      - claw
      - db
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      #- ./mcp.json:/etc/mcp.json # Mount MCP servers directory
    networks:
      - build-x-network
    env_file:
      - .env

  sandbox:
    image: ${IMAGE_REGISTRY:-your-dockerhub-username}/build-x-sandbox:${IMAGE_TAG:-latest}
    build:
      context: ./sandbox
      dockerfile: Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    command: /bin/sh -c "exit 0"  # prevent sandbox from starting, ensure image is pulled
    restart: "no"
    networks:
      - build-x-network

  claw:
    image: ${IMAGE_REGISTRY:-your-dockerhub-username}/build-x-claw:${IMAGE_TAG:-latest}
    build:
      context: ./claw
      dockerfile: Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    entrypoint: /bin/sh -c "exit 0"  # prevent claw from starting, ensure image is pulled
    restart: "no"
    networks:
      - build-x-network

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=build_x
      - POSTGRES_PASSWORD=build_x
      - POSTGRES_DB=build_x
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - build-x-network

volumes:
  postgres_data:
    name: build-x-postgres-data

networks:
  build-x-network:
    name: build-x-network
    driver: bridge