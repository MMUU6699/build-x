services:
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build-stage  # Use build stage image instead of production image
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]  # Start in development mode and listen on all network interfaces
    volumes:
      - ./frontend:/app  # Mount source code directory
      - /app/node_modules  # Avoid overwriting container's node_modules
    ports:
      - "5173:5173"  # Vite default development port
    environment:
      - NODE_ENV=development
      #- VITE_API_URL=http://127.0.0.1:8000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - build-x-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      [
        "uv", "run", 
        "debugpy", "--listen", "0.0.0.0:5678", "-m", # Enable debug
        "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload",
        "--timeout-graceful-shutdown","0"
      ]
    volumes:
      - ./backend:/app  # Mount source code directory
      #- ./mcp.json:/etc/mcp.json # Mount MCP servers directory
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /app/__pycache__  # Avoid overwriting cache files
      - /app/.venv  # Avoid overwriting virtual environment
    ports:
      - "8000:8000"
      - "5678:5678" # Debug port
    depends_on:
      sandbox:
        condition: service_started
        required: false
      claw:
        condition: service_started
        required: false
      db:
        condition: service_started
        required: true
    restart: unless-stopped
    networks:
      - build-x-network
    env_file:
      - .env
    environment:
      - SANDBOX_ADDRESS=sandbox # Use single container as sandbox
      - CLAW_ADDRESS=claw       # Use single fixed claw container in development
      - BUILD_X_API_BASE_URL=http://backend:8000
      - CLAW_API_KEY=${CLAW_DEV_API_KEY:-build-x-dev-api-key-changeme}

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    hostname: sandbox
    volumes:
      - ./sandbox:/app  # Mount source code directory
      - ./sandbox/supervisord.conf:/etc/supervisor/conf.d/app.conf
      - /app/__pycache__  # Avoid overwriting cache files
      - /app/.venv  # Avoid overwriting virtual environment
    ports:
      #- "9222:9222"
      - "5902:5900"
      #- "5901:5901"
      - "8080:8080"
    environment:
      - UVI_ARGS="--reload"
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    restart: unless-stopped
    networks:
      - build-x-network

  claw:
    build:
      context: ./claw
      dockerfile: Dockerfile
    hostname: claw
    ports:
      - "18788:18788" # build-x-claw HTTP server
    environment:
      - CLAW_TTL_SECONDS=0        # No TTL in development (0 = unlimited)
      - BUILD_X_API_BASE_URL=http://backend:8000
      - BUILD_X_API_KEY=${CLAW_DEV_API_KEY:-build-x-dev-api-key-changeme}
    restart: unless-stopped
    networks:
      - build-x-network

  mockserver:
    build:
      context: ./mockserver
      dockerfile: Dockerfile
    volumes:
      - ./mockserver:/app  # Mount source code directory
      - /app/__pycache__  # Avoid overwriting cache files
      - /app/.venv  # Avoid overwriting virtual environment
    restart: unless-stopped
    environment:
      - MOCK_DATA_FILE=default.yaml
      - MOCK_DELAY=1
    networks:
      - build-x-network

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=build_x
      - POSTGRES_PASSWORD=build_x
      - POSTGRES_DB=build_x
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - build-x-network

volumes:
  postgres_data:
    name: build-x-postgres-data

networks:
  build-x-network:
    name: build-x-network
    driver: bridge
