# TODO: ضع اسم حسابك على Docker Hub هنا عند النشر (your-dockerhub-username)
services:
  frontend:
    image: your-dockerhub-username/build-x-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - build-x-network
    environment:
      - BACKEND_URL=http://backend:8000

  backend:
    image: your-dockerhub-username/build-x-backend
    depends_on:
      - sandbox
      - claw
      - db
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      #- ./mcp.json:/etc/mcp.json # Mount MCP servers directory
    networks:
      - build-x-network
    env_file:
      # All configuration is loaded from the .env file, see .env.example
      # More configuration options: https://docs.build-x.example/#/configuration
      - .env

  sandbox:
    image: your-dockerhub-username/build-x-sandbox
    command: /bin/sh -c "exit 0"  # prevent sandbox from starting, ensure image is pulled
    restart: "no"
    networks:
      - build-x-network

  claw:
    image: your-dockerhub-username/build-x-claw
    entrypoint: /bin/sh -c "exit 0"  # prevent claw from starting, ensure image is pulled
    restart: "no"
    networks:
      - build-x-network

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=build_x
      - POSTGRES_PASSWORD=build_x
      - POSTGRES_DB=build_x
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - build-x-network

volumes:
  postgres_data:
    name: build-x-postgres-data

networks:
  build-x-network:
    name: build-x-network
    driver: bridge